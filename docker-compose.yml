# Local stack. `pnpm up` builds and starts everything; `pnpm stack:test` runs
# the suite inside the same image the services run in.
#
# Services are added as they are built. Each new Node satellite is four lines:
# a build arg pointing at its workspace path, a port, an env block, a healthcheck.

name: dynamic-portal

x-node-build: &node-build
  context: .
  dockerfile: docker/node-app.Dockerfile

x-satellite-env: &satellite-env
  NODE_ENV: development
  # Dev-only shared secret. Production replaces this with per-satellite
  # verification of an RFC 8693 exchanged token against the issuer's JWKS.
  PORTAL_PRINCIPAL_SECRET: ${PORTAL_PRINCIPAL_SECRET:-dev-only-not-a-real-secret}

services:
  satellite-orders:
    build:
      <<: *node-build
      args:
        APP_PATH: apps/satellite-orders
    environment:
      <<: *satellite-env
      PORT: "4001"
    ports:
      - "4001:4001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4001/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Python, and deliberately no MCP server — the case that proves the hub's
  # PUP-to-MCP shim has something to do. Its manifest is validated against the
  # TypeScript protocol schemas by the e2e tier, which is where the polyglot
  # claim stops being a claim.
  satellite-fleet:
    build:
      context: .
      dockerfile: docker/python-app.Dockerfile
      args:
        APP_PATH: apps/satellite-fleet
    environment:
      <<: *satellite-env
      PORT: "4002"
    ports:
      - "4002:4002"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4002/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # The third satellite, in a third language. Node, Python and C# — sharing no
  # library but the SDK generated from the hub's own catalog, and each
  # verifying the hub's principal itself.
  satellite-depots:
    build:
      context: .
      dockerfile: docker/dotnet-app.Dockerfile
      args:
        APP_PATH: apps/satellite-depots
        PROJECT: Satellite.Depots
    environment:
      <<: *satellite-env
      ASPNETCORE_URLS: http://+:4003
      PORT: "4003"
    ports:
      - "4003:4003"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4003/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # The identity provider. Imports the committed realm on boot: four org roles,
  # the confidential `portal-hub` client, and one demo user per role
  # (lead / eng / fin / plat @acme.example, password = the username).
  #
  # KC_HOSTNAME is the browser-facing URL, so token `iss` and the login redirect
  # both use localhost:8080. The hub reaches this service internally at
  # keycloak:8080 and bridges the two origins for its own back-channel calls via
  # PORTAL_OIDC_INTERNAL_ORIGIN (see apps/hub/src/lib/oidc.ts); backchannel-
  # dynamic lets those internal requests resolve against the request host.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./docker/keycloak/realm-portal.json:/opt/keycloak/data/import/realm-portal.json:ro
    ports:
      - "8080:8080"
    healthcheck:
      # The Keycloak image ships no curl; bash (present) opening a TCP socket to
      # the port is a dependable readiness proxy, paired with a long start_period
      # for the realm import. The hub's discovery is lazy and retries besides.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: unless-stopped

  # The hub. Waits for every satellite to be healthy — not because it cannot
  # start without them (an unwell satellite degrades to a scoped card, and there
  # is an e2e test for exactly that), but so `pnpm up` reaches a state where the
  # whole stack is demonstrably working rather than half of it.
  hub:
    build:
      context: .
      dockerfile: docker/hub.Dockerfile
    environment:
      <<: *satellite-env
      NODE_ENV: production
      # The dev session stub refuses to run under NODE_ENV=production unless
      # this is set. Explicit here so the compose stack is obviously not a
      # production deployment.
      PORTAL_ALLOW_DEV_SESSION: ${PORTAL_ALLOW_DEV_SESSION:-1}
      # Acts as this org role in the dev session, so the RBAC model is visible
      # before real OIDC login exists: `PORTAL_DEV_ROLES=finance docker compose
      # up -d hub` re-creates the hub as finance and the nav, screens, and agent
      # surface narrow to what finance may see. Unset means every role.
      PORTAL_DEV_ROLES: ${PORTAL_DEV_ROLES:-}
      # Mandatory. The hub refuses to serve without both: a default key would
      # produce a log that looks keyed and is not, and a default path one that
      # nobody knows to collect.
      # Passed through from the root `.env`, which compose loads and git
      # ignores. Absent means the assistant is off, which is a supported way to
      # run this portal rather than a broken one — every deterministic screen
      # behaves identically either way.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # The kill switches, both off by default. Passed through because a control
      # that cannot be exercised in the stack it governs is a control nobody has
      # tested: `PORTAL_AGENT=off docker compose up` silently did nothing before
      # this line existed, and the assistant-off run it was supposed to produce
      # was really only ever a run with no API key.
      PORTAL_AGENT: ${PORTAL_AGENT:-}
      # Which palette the portal wears. Every brand ships in the stylesheet, so
      # a rebrand re-creates this container rather than rebuilding its image:
      # `docker compose up -d hub`, and *not* `restart`, which re-runs the same
      # process with the environment it was created with and changes nothing.
      # An unrecognised name is a startup error rather than a rebrand that
      # silently did not happen.
      PORTAL_BRAND: ${PORTAL_BRAND:-}
      # A model on the developer's own machine, off unless asked for. The
      # default URL reaches the host from inside the container, which is the
      # one thing that differs from running the hub directly.
      PORTAL_MODEL_PROVIDER: ${PORTAL_MODEL_PROVIDER:-}
      PORTAL_OLLAMA_URL: ${PORTAL_OLLAMA_URL:-http://host.docker.internal:11434}
      PORTAL_OLLAMA_MODEL: ${PORTAL_OLLAMA_MODEL:-}
      PORTAL_AGENT_DISABLED_TENANTS: ${PORTAL_AGENT_DISABLED_TENANTS:-}
      PORTAL_AUDIT_KEY: ${PORTAL_AUDIT_KEY:-dev-only-not-a-real-audit-key}
      PORTAL_AUDIT_LOG: /tmp/portal-audit.jsonl
      PORT: "3000"
      # Inside the network the satellites answer to their service names, not to
      # localhost. The registry file defaults to localhost for a laptop and is
      # overridden here — one reviewed file, two environments.
      PORTAL_ORDERS_URL: http://satellite-orders:4001
      # Same host, same port, same signed principal — a second protocol on the
      # satellite, not a second deployment of it.
      PORTAL_ORDERS_MCP_URL: http://satellite-orders:4001/mcp
      PORTAL_FLEET_URL: http://satellite-fleet:4002
      PORTAL_DEPOTS_URL: http://satellite-depots:4003
      # OIDC login (Keycloak). The issuer is the browser-facing URL so the login
      # redirect and token `iss` resolve for the user; the hub's own back-channel
      # calls (discovery, token, JWKS) are rewritten to the internal origin.
      # Leave PORTAL_ALLOW_DEV_SESSION at 1 and this is available but optional;
      # set it to 0 (`PORTAL_ALLOW_DEV_SESSION=0 docker compose up`) to force real
      # Keycloak login. Log in as lead / eng / fin / plat (password = username).
      PORTAL_OIDC_ISSUER: ${PORTAL_OIDC_ISSUER:-http://localhost:8080/realms/portal}
      PORTAL_OIDC_INTERNAL_ORIGIN: ${PORTAL_OIDC_INTERNAL_ORIGIN:-http://keycloak:8080}
      PORTAL_OIDC_CLIENT_ID: ${PORTAL_OIDC_CLIENT_ID:-portal-hub}
      PORTAL_OIDC_CLIENT_SECRET: ${PORTAL_OIDC_CLIENT_SECRET:-portal-hub-dev-secret}
      PORTAL_OIDC_REDIRECT_URI: ${PORTAL_OIDC_REDIRECT_URI:-http://localhost:3000/api/auth/callback}
      PORTAL_SESSION_SECRET: ${PORTAL_SESSION_SECRET:-dev-only-not-a-real-session-secret}
      # The origin an MCP host reaches this hub at. It is configuration rather
      # than a read of the `Host` header because it names the OAuth resource the
      # access token must be audienced to, and a header is caller-supplied.
      # Must match the audience mapper on the `portal-mcp` realm client.
      PORTAL_PUBLIC_ORIGIN: ${PORTAL_PUBLIC_ORIGIN:-http://localhost:3000}
    # `host.docker.internal` is a Docker Desktop convenience; on Linux the name
    # does not resolve at all, and the only symptom is the assistant answering
    # "could not complete that request". Mapped explicitly so the local-model
    # default URL above reaches the host everywhere.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # The registry, live rather than baked in.
      #
      # `COPY . .` puts a copy of this file in the image, so a hub restarted
      # after an edit re-read its own stale copy and nothing changed — which
      # quietly falsified the loudest claim this design makes, that adding or
      # renaming a satellite costs zero deployments. Mounted read-only: the hub
      # reads this file and has no business writing it.
      - ./config/satellites.yaml:/repo/config/satellites.yaml:ro
    ports:
      - "3000:3000"
    depends_on:
      satellite-orders:
        condition: service_healthy
      satellite-fleet:
        condition: service_healthy
      satellite-depots:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      # `/healthz`, not `/`. The landing page now asks every satellite for its
      # manifest, health and summary screen, so probing it every five seconds
      # put the whole estate under permanent load and filled the audit log with
      # machine-generated reads attributed to a person. Liveness is a question
      # about this process.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/healthz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # Runs the workspace suite in the same image the services run in, so a green
  # local run and a green containerised run mean the same thing.
  test:
    build:
      <<: *node-build
      args:
        APP_PATH: apps/satellite-orders
    environment:
      <<: *satellite-env
    depends_on:
      satellite-orders:
        condition: service_healthy
    # Both in-process tiers, not just unit: running only `test:unit` in the image
    # would exercise exactly the tier that needs no container, and would leave
    # the integration tier — the one that proves a satellite scopes its own
    # tenants — untested in the environment the services actually run in.
    command: ["sh", "-c", "pnpm run test:unit && pnpm run test:integration"]
    profiles: ["test"]
